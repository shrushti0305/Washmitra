<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WashMitra</title>
    <script type="text/javascript">
      // SPA Fallback for GitHub Pages and Custom Domain (washmitra.com)
      (function() {
        var l = window.location;
        var pathname = l.pathname || '';
        
        var repoPrefix = '';
        var match = pathname.match(/^\/([^/]+)/);
        if (match && match[1].toLowerCase() === 'washmitra') {
          repoPrefix = '/' + match[1];
          pathname = pathname.substring(match[0].length);
        }
        
        if (!pathname || pathname === '/') {
          pathname = '';
        }
        
        if (pathname && !pathname.startsWith('/')) {
          pathname = '/' + pathname;
        }
        
        var targetUrl = l.protocol + '//' + l.host + repoPrefix + '/#' + pathname + l.search + l.hash;
        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
