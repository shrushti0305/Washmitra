<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WashMitra</title>
    <script type="text/javascript">
      // SPA Fallback for GitHub Pages and Custom Domain (washmitra.com)
      (function() {
        var l = window.location;
        var path = l.pathname || '';
        
        // Remove trailing or leading duplicate slashes
        path = path.replace(/\/+/g, '/');
        
        // Remove repo subpath prefix if present (e.g. /Washmitra/admin -> /admin)
        if (path.toLowerCase().startsWith('/washmitra')) {
          path = path.substring(10);
        }
        
        if (!path || path === '/') {
          path = '';
        }
        
        // Ensure single leading slash for hash route (e.g. /admin)
        if (path && !path.startsWith('/')) {
          path = '/' + path;
        }
        
        // Construct clean target URL: protocol//host/#/path
        var targetUrl = l.protocol + '//' + l.host + l.search + '/#' + path + l.hash;
        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
