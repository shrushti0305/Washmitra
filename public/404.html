<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WashMitra</title>
    <script type="text/javascript">
      // SPA Fallback for GitHub Pages and Custom Domain (washmitra.com)
      (function() {
        var l = window.location;
        var path = l.pathname;
        
        // Remove trailing repo name if present (e.g. /Washmitra/admin -> /admin)
        if (path.toLowerCase().startsWith('/washmitra')) {
          path = path.substring(10);
        }
        
        if (!path || path === '/') {
          path = '';
        }
        
        // Redirect directly to HashRouter target e.g. washmitra.com/#/admin
        var targetUrl = l.protocol + '//' + l.host + l.search + '/#' + path + l.hash;
        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
